<div class="login-page login-page--compact">
    <div class="login-wrapper">
        <div class="login-card panel panel-default" ng-class='{"panel-danger": errorMessage, "panel-success": successMessage}'>
            <div class="panel-heading login-card-heading login-card-heading--error" ng-if='errorMessage'>{{errorMessage}}</div>
            <div class="panel-heading login-card-heading login-card-heading--ok" ng-if='successMessage'>{{successMessage}}</div>
            <div class="panel-body login-card-body" ng-if="linkValid">
                <div class="login-card-brand">
                    <span class="login-seal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l6.5 2.3v4.8c0 4.3-2.8 7.5-6.5 8.6-3.7-1.1-6.5-4.3-6.5-8.6V4.8z"/><rect x="9" y="7.6" width="6" height="8" rx="1.4"/><path d="M11 14.2h2"/></svg>
                    </span>
                    <span class="login-word">Mikitos MDM<small>NOVA SENHA</small></span>
                </div>
                <h2 class="login-card-title" localized>form.password.reset.title</h2>
                <span class="login-deco-line"></span>

                <form name='passwordResetForm' class="login-form">
                    <div class='form-group'>
                        <label for='newPassword' localized>form.profile.password.new</label>
                        <input type='password' class='form-control' id='newPassword' autocomplete="new-password"
                               ng-model='reset.newPassword' localized-placeholder='form.profile.password.new.placeholder'
                               required/>
                    </div>
                    <div class='form-group'>
                        <label for='confirmPassword' localized>form.profile.password.confirm</label>
                        <input type='password' class='form-control' id='confirmPassword' autocomplete="new-password"
                               ng-model='reset.confirmPassword' localized-placeholder='form.profile.password.confirm.placeholder'
                               required/>
                        <div class="field-hint">{{qualityMessage}}</div>
                    </div>
                    <button type='submit' class='btn btn-primary btn-block login-submit' ng-click='resetPassword()'
                            localized>form.password.reset.submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
