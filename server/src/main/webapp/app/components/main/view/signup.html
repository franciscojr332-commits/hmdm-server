<div class="login-page login-page--compact">
    <div class="login-wrapper">
        <div class="login-card panel panel-default" ng-class='{"panel-danger": errorMessage, "panel-success": successMessage}'>
            <div class="panel-heading login-card-heading login-card-heading--error" ng-if='errorMessage'>{{errorMessage}}</div>
            <div class="panel-heading login-card-heading login-card-heading--ok" ng-if='successMessage'>{{successMessage}}</div>
            <div class="panel-body login-card-body">
                <div class="login-card-brand">
                    <span class="login-seal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l6.5 2.3v4.8c0 4.3-2.8 7.5-6.5 8.6-3.7-1.1-6.5-4.3-6.5-8.6V4.8z"/><rect x="9" y="7.6" width="6" height="8" rx="1.4"/><path d="M11 14.2h2"/></svg>
                    </span>
                    <span class="login-word">Mikitos MDM<small>SOLICITAR ACESSO</small></span>
                </div>
                <h2 class="login-card-title" localized>signup.title</h2>
                <span class="login-deco-line"></span>

                <form name='signupForm' ng-submit='signupForm.$valid && onSignup()' class="login-form" ng-if="!signupComplete">
                    <div class='form-group'>
                        <label for='email' localized>signup.email</label>
                        <input class='form-control' name="email" id='email' ng-pattern="/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/" autocomplete="email"
                               ng-model='signup.email' localized-placeholder="signup.email.placeholder"
                               required/>
                        <div class="field-warning" ng-class="(signupForm.email.$dirty && signupForm.email.$error.pattern) ? '' : 'expired-device-hidden'" localized>signup.email.invalid</div>
                    </div>
                    <div class='form-group login-terms' ng-if="rebranding.termsLink">
                        <input type='checkbox' id='agree' class="cbx" ng-model='signup.agree' required/>
                        <label for='agree'><span localized>signup.terms.agree</span> <span>{{rebranding.appName}}
                            <a href="{{rebranding.termsLink}}" target="_blank" localized>signup.terms.terms</a></span></label>
                    </div>

                    <button type='submit' class='btn btn-primary btn-block login-submit'
                            ng-if="!loading" localized>signup.submit</button>
                    <button type='submit' class='btn btn-primary btn-block login-submit' style="opacity:.6"
                            ng-disabled='true' ng-if="loading" localized>signup.progress</button>
                </form>

                <div ng-if="signupComplete" class="login-msg">
                    <h3 localized>signup.complete</h3>
                    <p localized>signup.email.check</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="login-footer" ng-if="rebranding">
    <span>{{rebranding.appName}}</span> (c) {{rebranding.year}}
</div>
